<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Crown & Co. — Rolex Authorized Boutique. Explore the Submariner, Daytona, Datejust and GMT-Master II in a live 3D atelier.">
<meta name="theme-color" content="#0a0a0a">
<title>Crown &amp; Co. — Rolex Authorized Boutique · Haute Horlogerie in 3D</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 34'><path fill='%23c9a961' d='M4 24 L7 10 L14.5 18 L20 5 L25.5 18 L33 10 L36 24 Z M6 26 h28 v3.5 H6 z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   CROWN & CO. — LUXURY WATCH ATELIER
   Design tokens · Layout · Components · Motion · Responsive · RTL
   ═══════════════════════════════════════════════════════════════ */

/* ── Tokens ─────────────────────────────────────────────────── */
:root{
  --bg:#0a0a0a;
  --bg-2:#0f1011;
  --bg-3:#131517;
  --ink:#f5f1e8;
  --ink-dim:rgba(245,241,232,.60);
  --ink-faint:rgba(245,241,232,.34);
  --gold:#c9a961;
  --gold-bright:#e3cb8f;
  --gold-soft:rgba(201,169,97,.35);
  --gold-faint:rgba(201,169,97,.14);
  --green:#006039;
  --green-deep:#014230;
  --hairline:rgba(245,241,232,.12);
  --hairline-gold:rgba(201,169,97,.32);
  --card:rgba(255,255,255,.030);
  --card-2:rgba(255,255,255,.055);
  --danger:#e07a6a;
  --ok:#7fc9a2;
  --font-head:'Cormorant Garamond','Cairo',Georgia,serif;
  --font-body:'Inter','Cairo','Helvetica Neue',Arial,sans-serif;
  --nav-h:78px;
  --ease:cubic-bezier(.19,1,.22,1);
  --ease-soft:cubic-bezier(.33,1,.68,1);
  --sec-pad:clamp(90px,12vh,170px);
  --gutter:clamp(20px,4vw,64px);
}
html[lang="ar"]{
  --font-head:'Cairo','Cormorant Garamond',Tahoma,sans-serif;
  --font-body:'Cairo','Inter',Tahoma,sans-serif;
}
[data-theme="light"]{
  --bg:#f5f1e8;
  --bg-2:#ede7d9;
  --bg-3:#e4dccb;
  --ink:#141613;
  --ink-dim:rgba(20,22,19,.62);
  --ink-faint:rgba(20,22,19,.38);
  --hairline:rgba(20,22,19,.15);
  --hairline-gold:rgba(140,110,44,.45);
  --card:rgba(20,22,19,.035);
  --card-2:rgba(20,22,19,.06);
  --gold:#9a7d3a;
  --gold-bright:#7c6224;
  --gold-soft:rgba(154,125,58,.4);
  --gold-faint:rgba(154,125,58,.14);
}

/* ── Reset / base ───────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.65;
  font-weight:300;
  overflow-x:clip;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img,svg,canvas{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:500;line-height:1.08;letter-spacing:.01em}
::selection{background:var(--gold);color:#0a0a0a}
:focus{outline:none}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px;border-radius:1px}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#2a2c26;border-radius:9px;border:2px solid #0a0a0a}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}
.skip-link{
  position:fixed;top:-60px;left:24px;z-index:400;background:var(--gold);color:#0a0a0a;
  padding:10px 22px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  transition:top .3s var(--ease);border-radius:2px;
}
.skip-link:focus{top:16px}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ── Typography helpers ─────────────────────────────────────── */
.kicker{
  display:inline-flex;align-items:center;gap:14px;
  font-size:11px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--gold);font-weight:500;
}
.kicker::before{content:"";width:38px;height:1px;background:var(--gold);opacity:.7;flex:none}
html[lang="ar"] .kicker{letter-spacing:.14em}
.sec-title{font-size:clamp(38px,5.2vw,72px);margin:22px 0 0}
.sec-title em{font-style:italic;color:var(--gold)}
.sec-sub{max-width:560px;color:var(--ink-dim);margin-top:22px;font-size:clamp(15px,1.2vw,17px)}
.hairline{height:1px;background:var(--hairline);position:relative;overflow:visible}
.hairline::after{
  content:"";position:absolute;left:50%;top:-2.5px;width:6px;height:6px;
  background:var(--gold);transform:translateX(-50%) rotate(45deg);opacity:.8;
}

/* ── Layout ─────────────────────────────────────────────────── */
.section{position:relative;padding:var(--sec-pad) var(--gutter)}
.wrap{max-width:1480px;margin-inline:auto;position:relative}
.sec-head{max-width:760px}
#craft,#testimonials,#boutiques,#newsletter,footer.site{background:var(--bg);z-index:3}

/* ── Smooth-scroll shell ────────────────────────────────────── */
html.smooth #page{
  position:fixed;top:0;left:0;width:100%;
  will-change:transform;backface-visibility:hidden;
}
html:not(.smooth) #scroll-spacer{display:none}

/* ── Custom cursor ──────────────────────────────────────────── */
#cur-dot,#cur-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:320;opacity:0}
#cur-dot{
  width:5px;height:5px;border-radius:50%;background:var(--gold);
  transform:translate(-50%,-50%);
}
#cur-ring{
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--gold);opacity:0;
  transform:translate(-50%,-50%) scale(1);
  transition:width .35s var(--ease),height .35s var(--ease),border-color .35s,background .35s;
}
html.cur-on #cur-dot{opacity:1}
html.cur-on #cur-ring{opacity:.9}
html.cur-on #cur-ring.is-hover{
  width:64px;height:64px;background:rgba(201,169,97,.08);
  border-color:var(--gold-bright);
}
html.cur-on html, html.cur-on body{}
html.cur-on, html.cur-on a, html.cur-on button, html.cur-on .wcard{cursor:none}
html.cur-on input, html.cur-on select, html.cur-on textarea{cursor:auto}
@media (hover:none),(pointer:coarse){#cur-dot,#cur-ring{display:none}}

/* ── Preloader ──────────────────────────────────────────────── */
#loader{
  position:fixed;inset:0;z-index:360;background:#0a0a0a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  transition:clip-path 1.1s var(--ease),visibility 0s 1.2s;
  clip-path:inset(0 0 0 0);
}
#loader.done{clip-path:inset(0 0 100% 0);visibility:hidden}
.ld-mark{position:relative;width:132px;height:132px;display:grid;place-items:center}
.ld-ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 24%,var(--gold) 50%,transparent 76% 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));
  animation:ldspin 1.4s linear infinite;
}
@keyframes ldspin{to{transform:rotate(360deg)}}
.ld-crown{width:58px;filter:drop-shadow(0 0 18px rgba(201,169,97,.35))}
.ld-crown path{
  stroke:var(--gold);stroke-width:1.4;fill:rgba(201,169,97,.06);
  stroke-dasharray:260;stroke-dashoffset:260;animation:lddraw 2.6s var(--ease-soft) forwards;
}
@keyframes lddraw{to{stroke-dashoffset:0}}
.ld-num{
  font-family:var(--font-head);font-size:52px;font-weight:500;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1;min-width:120px;text-align:center;
}
.ld-num small{font-size:22px;color:var(--gold);margin-inline-start:4px}
.ld-tag{
  font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--ink-faint);
  animation:ldpulse 2.2s ease-in-out infinite;
}
@keyframes ldpulse{0%,100%{opacity:.4}50%{opacity:1}}
html.no-anim #loader{display:none}

/* ── Giant backdrop word + canvas ───────────────────────────── */
#giant{
  position:fixed;inset:0;z-index:0;display:grid;place-items:center;
  pointer-events:none;user-select:none;overflow:hidden;
}
#giant span{
  font-family:var(--font-head);font-weight:600;
  font-size:clamp(88px,19vw,300px);line-height:1;white-space:nowrap;
  color:transparent;-webkit-text-stroke:1px rgba(201,169,97,.20);
  letter-spacing:.06em;transform:translateY(-4vh);
  transition:opacity .45s ease,letter-spacing .8s var(--ease);
}
#giant span.swap{opacity:0;letter-spacing:.14em}
html[lang="ar"] #giant span{-webkit-text-stroke:1px rgba(201,169,97,.16);font-weight:700;font-size:clamp(80px,16vw,250px)}
#gl{
  position:fixed;inset:0;z-index:1;width:100%;height:100%;
  pointer-events:none;opacity:1;transition:opacity .7s ease;
}
#gl.off{opacity:0}
#gl-wrap-fallback{
  position:fixed;inset:0;z-index:1;display:none;place-items:center;
}
html.no-gl #gl-wrap-fallback{display:grid}
.fallback-watch{
  width:min(420px,70vw);aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 38% 32%,rgba(255,255,255,.16),transparent 42%),
    radial-gradient(circle at 50% 50%,#1b1d1f 0 58%,#101112 58% 60%,#23262a 60% 62%,#0e0f10 62% 100%);
  border:1px solid rgba(201,169,97,.25);
  box-shadow:0 0 120px rgba(201,169,97,.08),inset 0 0 60px rgba(0,0,0,.7);
  position:relative;
}
.fallback-watch::before{
  content:"";position:absolute;top:8%;left:50%;width:2px;height:40%;
  background:linear-gradient(var(--ink),var(--gold));transform-origin:bottom;
  transform:translateX(-50%) rotate(38deg);box-shadow:0 0 8px rgba(201,169,97,.5);
}
.fallback-watch::after{
  content:"CROWN & CO.";position:absolute;inset:auto 0 26%;text-align:center;
  font-family:var(--font-head);letter-spacing:.5em;font-size:12px;color:var(--gold);
}
.fallback-note{margin-top:34px;color:var(--ink-faint);font-size:13px;letter-spacing:.08em;text-align:center}

/* ── Navigation ─────────────────────────────────────────────── */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav-h);
  transition:background .5s ease,backdrop-filter .5s ease,border-color .5s ease,transform .5s var(--ease);
  border-bottom:1px solid transparent;
}
#nav.scrolled{
  background:rgba(10,10,10,.72);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);
  backdrop-filter:blur(18px) saturate(1.3);
  border-bottom-color:rgba(245,241,232,.08);
}
#nav.hidden-up{transform:translateY(-100%)}
.nav-inner{
  max-width:1480px;margin-inline:auto;height:100%;
  padding:0 var(--gutter);display:flex;align-items:center;gap:26px;
}
.logo{display:flex;align-items:center;gap:13px;flex:none}
.logo-crown{width:26px;transition:transform .6s var(--ease)}
.logo:hover .logo-crown{transform:rotate(-8deg) scale(1.08)}
.logo-text{display:flex;flex-direction:column;line-height:1.15}
.logo-name{font-family:var(--font-head);font-size:21px;font-weight:600;letter-spacing:.08em}
.logo-sub{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
html[lang="ar"] .logo-sub{letter-spacing:.12em;font-size:9.5px}
.nav-links{display:flex;gap:34px;margin-inline-start:auto}
.nav-links a{
  position:relative;font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-dim);padding:8px 2px;transition:color .35s;
}
html[lang="ar"] .nav-links a{letter-spacing:.06em;font-size:13px}
.nav-links a::after{
  content:"";position:absolute;bottom:0;left:0;width:100%;height:1px;
  background:var(--gold);transform:scaleX(0);transform-origin:right;
  transition:transform .5s var(--ease);
}
.nav-links a:hover,.nav-links a.active{color:var(--ink)}
.nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1);transform-origin:left}
.nav-tools{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.nav-links + .nav-tools{margin-inline-start:0}
.tool-btn{
  display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 13px;
  border:1px solid var(--hairline);border-radius:2px;
  font-size:11px;letter-spacing:.14em;color:var(--ink-dim);
  transition:border-color .35s,color .35s,background .35s;
}
.tool-btn:hover{border-color:var(--gold-soft);color:var(--ink)}
.tool-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5}
.cart-count{
  min-width:19px;height:19px;border-radius:10px;background:var(--gold);color:#0a0a0a;
  display:grid;place-items:center;font-size:10.5px;font-weight:600;padding:0 5px;
}
.cart-count[data-zero="1"]{background:transparent;color:var(--ink-faint);border:1px solid var(--hairline)}
select.currency{
  background:transparent;border:1px solid var(--hairline);height:40px;border-radius:2px;
  color:var(--ink-dim);font-size:11px;letter-spacing:.12em;padding:0 8px;
  transition:border-color .35s;cursor:pointer;
}
select.currency:hover{border-color:var(--gold-soft)}
select.currency option{background:#101112;color:var(--ink)}
.lang-btn{min-width:52px;justify-content:center;font-weight:600}
.burger{display:none;width:42px;height:42px;position:relative;border:1px solid var(--hairline);border-radius:2px}
.burger span{
  position:absolute;left:11px;right:11px;height:1px;background:var(--ink);
  transition:transform .45s var(--ease),opacity .3s,top .45s var(--ease);
}
.burger span:nth-child(1){top:15px}
.burger span:nth-child(2){top:20px}
.burger span:nth-child(3){top:25px}
.burger[aria-expanded="true"] span:nth-child(1){top:20px;transform:rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){top:20px;transform:rotate(-45deg)}

/* ── Mobile menu ────────────────────────────────────────────── */
#menu{
  position:fixed;inset:0;z-index:190;background:rgba(10,10,10,.97);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  display:flex;flex-direction:column;justify-content:center;padding:100px var(--gutter) 48px;
  opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s .5s;
}
#menu.open{opacity:1;visibility:visible;transition:opacity .5s ease}
.menu-links{display:flex;flex-direction:column;gap:6px}
.menu-links a{
  font-family:var(--font-head);font-size:clamp(34px,9vw,54px);padding:10px 0;
  border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;
  transition:color .3s,padding-inline-start .4s var(--ease);
}
.menu-links a:hover{color:var(--gold);padding-inline-start:14px}
.menu-links a small{font-family:var(--font-body);font-size:11px;color:var(--ink-faint);letter-spacing:.2em}
.menu-foot{margin-top:44px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ── Buttons ────────────────────────────────────────────────── */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;
  min-height:52px;padding:0 34px;border:1px solid var(--hairline-gold);border-radius:1px;
  font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:var(--ink);
  overflow:hidden;transition:color .45s var(--ease),border-color .45s;
  isolation:isolate;
}
html[lang="ar"] .btn{letter-spacing:.08em;font-size:13px}
.btn::before{
  content:"";position:absolute;inset:0;background:var(--gold);z-index:-1;
  transform:scaleX(0);transform-origin:right;transition:transform .55s var(--ease);
}
.btn:hover{color:#0a0a0a;border-color:var(--gold)}
.btn:hover::before{transform:scaleX(1);transform-origin:left}
.btn.btn-gold{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.btn.btn-gold::before{background:var(--gold-bright)}
.btn .btn-inner{display:inline-flex;align-items:center;gap:12px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.btn-wide{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.link-arrow{
  display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold);
}
html[lang="ar"] .link-arrow{letter-spacing:.06em}
.link-arrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;transition:transform .4s var(--ease)}
html[dir="rtl"] .link-arrow svg{transform:scaleX(-1)}
.link-arrow:hover svg{transform:translateX(5px)}
html[dir="rtl"] .link-arrow:hover svg{transform:scaleX(-1) translateX(5px)}

/* ── Hero ───────────────────────────────────────────────────── */
#hero{
  position:relative;min-height:100svh;display:flex;align-items:flex-end;
  padding:calc(var(--nav-h) + 40px) var(--gutter) 90px;
}
.hero-inner{max-width:1480px;margin-inline:auto;width:100%;position:relative;z-index:4}
.eyebrow{
  display:inline-flex;align-items:center;gap:16px;
  font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);
}
html[lang="ar"] .eyebrow{letter-spacing:.12em}
.eyebrow::before{content:"";width:44px;height:1px;background:var(--gold)}
.hero-title{
  font-size:clamp(64px,11vw,168px);line-height:.98;font-weight:500;
  margin:30px 0 0;letter-spacing:.005em;
}
.hero-title .row{display:block;overflow:hidden}
.hero-title .row-inner{display:inline-block;will-change:transform}
.hero-title .accent{font-style:italic;color:var(--gold);margin-inline-start:.22em}
.hero-sub{
  max-width:470px;color:var(--ink-dim);margin-top:30px;font-size:clamp(15px,1.25vw,17.5px);
}
.hero-cta{display:flex;flex-wrap:wrap;gap:16px;margin-top:42px}
.hero-meta{
  margin-top:58px;display:flex;align-items:center;gap:22px;
  font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-faint);
}
html[lang="ar"] .hero-meta{letter-spacing:.08em}
.hero-meta i{width:1px;height:26px;background:var(--hairline);font-style:normal}
.hero-halo{
  position:absolute;z-index:2;left:50%;top:44%;width:min(62vw,760px);aspect-ratio:1;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle,rgba(201,169,97,.10),rgba(201,169,97,.035) 40%,transparent 68%);
}
.scroll-hint{
  position:absolute;bottom:34px;right:var(--gutter);z-index:4;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--ink-faint);
  writing-mode:vertical-rl;
}
html[lang="ar"] .scroll-hint{letter-spacing:.15em}
.scroll-hint::after{
  content:"";width:1px;height:64px;background:linear-gradient(var(--gold),transparent);
  animation:hintdrop 2.2s var(--ease-soft) infinite;transform-origin:top;
}
@keyframes hintdrop{0%{transform:scaleY(0)}45%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* ── Story chapters ─────────────────────────────────────────── */
#story{position:relative;z-index:4}
.chapter{position:relative;min-height:172vh;display:flex}
.chapter:nth-child(even){justify-content:flex-end}
.ch-inner{
  position:sticky;top:0;min-height:100svh;display:flex;flex-direction:column;
  justify-content:center;max-width:520px;padding:0 var(--gutter);
  margin-inline:clamp(0px,6vw,110px);
  will-change:transform,opacity;
}
html.smooth .ch-inner{
  position:absolute;inset:0;min-height:0;max-width:none;margin-inline:0;
  padding-inline:var(--gutter);
}
html.smooth .ch-inner > *{max-width:520px}
html.smooth .chapter:nth-child(even) .ch-inner{align-items:flex-end;text-align:end}
.ch-num{
  font-family:var(--font-head);font-size:15px;letter-spacing:.5em;color:var(--gold);
  display:flex;align-items:center;gap:18px;
}
.ch-num::after{content:"";flex:1;max-width:90px;height:1px;background:var(--hairline-gold)}
.ch-title{font-size:clamp(36px,4.4vw,60px);margin-top:22px}
.ch-body{color:var(--ink-dim);margin-top:22px;font-size:clamp(15px,1.15vw,16.5px)}
.ch-chip{
  margin-top:30px;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;
  border:1px solid var(--hairline-gold);padding:11px 20px;border-radius:1px;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
}
html[lang="ar"] .ch-chip{letter-spacing:.06em;font-size:12px}
.ch-chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}

/* ── Collection ─────────────────────────────────────────────── */
#collection{z-index:4}
.col-grid{
  display:grid;grid-template-columns:minmax(340px,560px) 1fr;gap:clamp(24px,4vw,70px);
  align-items:start;
}
.col-list{display:flex;flex-direction:column;gap:16px}
.wcard{
  position:relative;border:1px solid var(--hairline);border-radius:2px;
  background:var(--card);padding:26px 28px 24px;
  transition:border-color .45s,background .45s,transform .55s var(--ease);
}
.wcard:hover{transform:translateY(-3px);border-color:var(--hairline-gold);background:var(--card-2)}
.wcard.active{border-color:var(--gold);background:rgba(201,169,97,.05)}
.wcard.active::after{
  content:"";position:absolute;top:-1px;inset-inline:-1px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.wcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.wcard-ref{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-faint)}
html[lang="ar"] .wcard-ref{letter-spacing:.08em}
.wcard-dim{font-size:10.5px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase}
.wcard-name{font-size:clamp(27px,2.4vw,36px);margin-top:8px;display:flex;align-items:center;gap:14px}
.wcard-name .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.wcard-desc{color:var(--ink-dim);font-size:14px;margin-top:10px;min-height:44px}
.wcard-specs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip-tag{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);
  border:1px solid var(--hairline);padding:5px 11px;border-radius:1px;
}
html[lang="ar"] .chip-tag{letter-spacing:.04em;font-size:11px}
.wcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;flex-wrap:wrap}
.wcard-price{display:flex;flex-direction:column}
.wcard-price small{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint)}
html[lang="ar"] .wcard-price small{letter-spacing:.08em}
.wcard-price .p{font-family:var(--font-head);font-size:26px;color:var(--ink);margin-top:2px}
.wcard-actions{display:flex;gap:10px}
.mini-btn{
  height:42px;min-width:42px;padding:0 18px;border:1px solid var(--hairline);border-radius:1px;
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);
  display:inline-flex;align-items:center;gap:8px;
  transition:all .4s;
}
html[lang="ar"] .mini-btn{letter-spacing:.05em;font-size:12px}
.mini-btn:hover{border-color:var(--gold);color:var(--gold)}
.mini-btn.solid{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.mini-btn.solid:hover{background:var(--gold-bright)}
.mini-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.col-stage{
  position:relative;min-height:640px;align-self:stretch;
}
.col-stage .stage-hint{
  position:absolute;bottom:8%;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-faint);
  white-space:nowrap;
}
html[lang="ar"] .col-stage .stage-hint{letter-spacing:.1em}
.col-note{margin-top:18px;font-size:12px;color:var(--ink-faint);letter-spacing:.06em}

/* ── Configurator ───────────────────────────────────────────── */
#configurator{z-index:4}
.cfg-grid{display:grid;grid-template-columns:minmax(330px,520px) 1fr;gap:clamp(24px,4vw,70px);align-items:start}
.cfg-panel{display:flex;flex-direction:column;gap:30px}
.cfg-group{border:1px solid var(--hairline);border-radius:2px;padding:22px 24px;background:var(--card)}
.cfg-group-label{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:16px;
}
html[lang="ar"] .cfg-group-label{letter-spacing:.1em}
.cfg-group-label b{color:var(--gold);font-weight:500;letter-spacing:.1em}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{
  width:46px;height:46px;border-radius:50%;position:relative;border:1px solid var(--hairline);
  transition:transform .4s var(--ease),border-color .4s;overflow:hidden;
}
.sw:hover{transform:scale(1.1)}
.sw[aria-pressed="true"]{border-color:var(--gold)}
.sw[aria-pressed="true"]::after{
  content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(255,255,255,.55);
}
.sw span{
  position:absolute;inset:6px;border-radius:50%;
  background:var(--sw,var(--ink-faint));
  box-shadow:inset -4px -6px 10px rgba(0,0,0,.55),inset 3px 4px 6px rgba(255,255,255,.22);
}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{
  height:44px;padding:0 20px;border:1px solid var(--hairline);border-radius:1px;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);
  transition:all .4s;
}
html[lang="ar"] .pill{letter-spacing:.04em;font-size:12.5px}
.pill:hover{border-color:var(--hairline-gold);color:var(--ink)}
.pill[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--gold-faint)}
.cfg-summary{
  border:1px solid var(--hairline-gold);border-radius:2px;padding:26px 28px;
  background:linear-gradient(160deg,rgba(201,169,97,.07),rgba(201,169,97,.015));
}
.cfg-sum-model{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.cfg-sum-model h3{font-size:30px}
.cfg-sum-model span{font-size:10.5px;letter-spacing:.22em;color:var(--ink-faint);text-transform:uppercase}
.cfg-lines{margin-top:18px;display:flex;flex-direction:column}
.cfg-line{
  display:flex;justify-content:space-between;gap:16px;padding:9px 0;
  border-bottom:1px dashed var(--hairline);font-size:13px;color:var(--ink-dim);
}
.cfg-line b{color:var(--ink);font-weight:400}
.cfg-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px}
.cfg-total small{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-faint)}
html[lang="ar"] .cfg-total small{letter-spacing:.1em}
.cfg-price{font-family:var(--font-head);font-size:44px;color:var(--gold);line-height:1}
.cfg-actions{display:flex;gap:12px;margin-top:24px}
.cfg-stage{position:relative;min-height:560px}
.cfg-stage .stage-hint{
  position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap;
}
html[lang="ar"] .cfg-stage .stage-hint{letter-spacing:.1em}

/* ── Craft / counters ───────────────────────────────────────── */
#craft{overflow:hidden}
.craft-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);border:1px solid var(--hairline);margin-top:64px}
.counter{background:var(--bg);padding:44px 30px 38px;text-align:center;position:relative}
.counter .num{
  font-family:var(--font-head);font-size:clamp(48px,4.6vw,74px);line-height:1;
  color:var(--ink);font-variant-numeric:tabular-nums;
}
.counter .num .sfx{color:var(--gold);font-size:.55em;margin-inline-start:4px}
.counter .lbl{margin-top:14px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-dim)}
html[lang="ar"] .counter .lbl{letter-spacing:.08em;font-size:12px}
.craft-cols{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(30px,5vw,90px);margin-top:70px;align-items:start}
.craft-copy p{color:var(--ink-dim);margin-bottom:20px;font-size:15.5px}
.craft-copy p strong{color:var(--ink);font-weight:500}
.craft-quote{
  font-family:var(--font-head);font-size:clamp(22px,2.2vw,30px);font-style:italic;line-height:1.4;
  border-inline-start:1px solid var(--hairline-gold);padding-inline-start:28px;color:var(--ink);
}
.craft-quote footer{margin-top:18px;font-family:var(--font-body);font-style:normal;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
html[lang="ar"] .craft-quote footer{letter-spacing:.08em}
.feat-list{display:flex;flex-direction:column}
.feat{
  display:grid;grid-template-columns:52px 1fr;gap:18px;padding:22px 0;
  border-bottom:1px solid var(--hairline);align-items:start;
}
.feat-ic{
  width:44px;height:44px;border:1px solid var(--hairline-gold);border-radius:50%;
  display:grid;place-items:center;color:var(--gold);
}
.feat-ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.3}
.feat h4{font-size:20px;font-weight:600}
.feat p{font-size:13.5px;color:var(--ink-dim);margin-top:5px}

/* ── Testimonials ───────────────────────────────────────────── */
.t-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:64px}
.t-card{
  border:1px solid var(--hairline);border-radius:2px;padding:34px 30px;background:var(--card);
  display:flex;flex-direction:column;gap:20px;transition:border-color .4s,transform .5s var(--ease);
}
.t-card:hover{border-color:var(--hairline-gold);transform:translateY(-4px)}
.stars{display:flex;gap:5px;color:var(--gold);font-size:13px;letter-spacing:3px}
.t-quote{font-family:var(--font-head);font-size:clamp(19px,1.6vw,23px);line-height:1.45;font-style:italic;flex:1}
.t-who{display:flex;align-items:center;gap:14px}
.t-avatar{
  width:44px;height:44px;border-radius:50%;flex:none;
  border:1px solid var(--hairline-gold);display:grid;place-items:center;
  font-family:var(--font-head);font-size:17px;color:var(--gold);
}
.t-who b{display:block;font-weight:500;font-size:14px}
.t-who small{color:var(--ink-faint);font-size:11.5px;letter-spacing:.05em}

/* ── Boutiques ──────────────────────────────────────────────── */
.b-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:64px}
.b-card{
  border:1px solid var(--hairline);border-radius:2px;padding:30px 26px;background:var(--card);
  transition:border-color .4s,transform .5s var(--ease);position:relative;overflow:hidden;
}
.b-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  transform:translateX(-100%);transition:transform .8s var(--ease);
}
.b-card:hover{transform:translateY(-4px);border-color:var(--hairline-gold)}
.b-card:hover::before{transform:translateX(0)}
.b-city{font-size:27px;display:flex;align-items:baseline;gap:10px}
.b-city small{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
html[lang="ar"] .b-city small{letter-spacing:.08em}
.b-line{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline);font-size:13px;color:var(--ink-dim);align-items:flex-start}
.b-line svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:1.4;flex:none;margin-top:4px}
.b-link{margin-top:18px}

/* ── Newsletter ─────────────────────────────────────────────── */
#newsletter{
  background:linear-gradient(180deg,var(--bg) 0%,#02150d 30%,var(--green-deep) 70%,#02150d 100%);
}
[data-theme="light"] #newsletter{background:linear-gradient(180deg,var(--bg),#dcd4bf)}
.nl-inner{max-width:680px;margin-inline:auto;text-align:center}
.nl-inner .kicker{justify-content:center}
.nl-inner .kicker::before{display:none}
.nl-form{display:flex;gap:0;margin-top:40px;border:1px solid var(--hairline-gold);border-radius:1px;overflow:hidden;background:rgba(0,0,0,.25)}
[data-theme="light"] .nl-form{background:rgba(255,255,255,.4)}
.nl-form input{
  flex:1;min-width:0;background:transparent;border:0;padding:18px 24px;color:var(--ink);
  font-size:14px;letter-spacing:.04em;
}
.nl-form input::placeholder{color:var(--ink-faint)}
.nl-form input:focus-visible{outline:none}
.nl-form button{
  flex:none;padding:0 34px;background:var(--gold);color:#0a0a0a;font-size:11.5px;
  letter-spacing:.22em;text-transform:uppercase;font-weight:600;transition:background .4s;
}
html[lang="ar"] .nl-form button{letter-spacing:.05em;font-size:13px}
.nl-form button:hover{background:var(--gold-bright)}
.nl-note{margin-top:18px;font-size:12px;color:var(--ink-faint)}
.nl-ok{
  display:none;margin-top:40px;padding:22px;border:1px solid var(--ok);border-radius:2px;
  color:var(--ok);font-size:14px;letter-spacing:.04em;gap:10px;align-items:center;justify-content:center;
}
.nl-ok.show{display:flex}
.nl-error{display:none;margin-top:14px;color:var(--danger);font-size:12.5px}
.nl-error.show{display:block}

/* ── Footer ─────────────────────────────────────────────────── */
footer.site{border-top:1px solid var(--hairline);padding:80px var(--gutter) 36px}
.f-grid{max-width:1480px;margin-inline:auto;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:clamp(28px,4vw,70px)}
.f-brand p{color:var(--ink-dim);font-size:13.5px;margin-top:18px;max-width:300px}
.f-social{display:flex;gap:10px;margin-top:26px}
.f-social a{
  width:40px;height:40px;border:1px solid var(--hairline);border-radius:50%;
  display:grid;place-items:center;font-size:10px;letter-spacing:.05em;color:var(--ink-dim);
  transition:all .4s;
}
.f-social a:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
.f-col h4{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-family:var(--font-body);font-weight:600;margin-bottom:22px}
html[lang="ar"] .f-col h4{letter-spacing:.08em;font-size:13px}
.f-col a,.f-col li{display:block;padding:7px 0;font-size:13.5px;color:var(--ink-dim);transition:color .3s,padding-inline-start .35s var(--ease)}
.f-col a:hover{color:var(--ink);padding-inline-start:8px}
.f-bottom{
  max-width:1480px;margin:64px auto 0;padding-top:26px;border-top:1px solid var(--hairline);
  display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;
  font-size:11.5px;color:var(--ink-faint);letter-spacing:.05em;
}
.f-bottom .top-btn{display:inline-flex;gap:8px;align-items:center;color:var(--ink-dim);letter-spacing:.2em;text-transform:uppercase;font-size:10px;transition:color .3s}
.f-bottom .top-btn:hover{color:var(--gold)}

/* ── Cart drawer ────────────────────────────────────────────── */
#cart-overlay{
  position:fixed;inset:0;z-index:290;background:rgba(5,5,5,.6);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s;
}
#cart-overlay.open{opacity:1;visibility:visible;transition:opacity .45s}
#cart-drawer{
  position:fixed;top:0;bottom:0;inset-inline-end:0;z-index:300;width:min(460px,94vw);
  background:#0d0e0f;border-inline-start:1px solid var(--hairline-gold);
  transform:translateX(105%);transition:transform .6s var(--ease);
  display:flex;flex-direction:column;
}
html[dir="rtl"] #cart-drawer{transform:translateX(-105%)}
#cart-drawer.open{transform:translateX(0)}
.cd-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 26px;border-bottom:1px solid var(--hairline);flex:none;
}
.cd-head h3{font-size:24px;display:flex;align-items:center;gap:12px}
.cd-head h3 svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.5}
.cd-close{width:40px;height:40px;border:1px solid var(--hairline);border-radius:50%;display:grid;place-items:center;transition:all .35s}
.cd-close:hover{border-color:var(--gold);color:var(--gold);transform:rotate(90deg)}
.cd-close svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.cd-body{flex:1;overflow-y:auto;padding:20px 26px;overscroll-behavior:contain}
.cd-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;text-align:center;color:var(--ink-dim)}
.cd-empty svg{width:52px;height:52px;stroke:var(--gold);fill:none;stroke-width:1;opacity:.7}
.cd-empty h4{font-size:22px;color:var(--ink)}
.cd-item{
  display:grid;grid-template-columns:56px 1fr auto;gap:16px;padding:18px 0;
  border-bottom:1px solid var(--hairline);align-items:center;
}
.cd-thumb{
  width:56px;height:56px;border-radius:50%;border:1px solid var(--hairline-gold);
  display:grid;place-items:center;font-family:var(--font-head);font-size:19px;color:var(--gold);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.10),transparent 50%),var(--card);
}
.cd-info b{display:block;font-weight:500;font-size:15px}
.cd-info small{color:var(--ink-faint);font-size:11px;letter-spacing:.04em;display:block;margin-top:3px}
.cd-qty{display:flex;align-items:center;gap:2px;border:1px solid var(--hairline);border-radius:1px;margin-top:10px;width:max-content}
.qbtn{width:30px;height:30px;display:grid;place-items:center;color:var(--ink-dim);transition:color .3s}
.qbtn:hover{color:var(--gold)}
.qbtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.7}
.cd-qty output{min-width:30px;text-align:center;font-size:13px}
.cd-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.cd-price{font-family:var(--font-head);font-size:19px}
.cd-rm{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);transition:color .3s}
.cd-rm:hover{color:var(--danger)}
.cd-foot{flex:none;border-top:1px solid var(--hairline);padding:22px 26px 26px}
.cd-sub{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.cd-sub small{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint)}
html[lang="ar"] .cd-sub small{letter-spacing:.08em}
.cd-sub .p{font-family:var(--font-head);font-size:30px;color:var(--gold)}
.cd-tax{font-size:11.5px;color:var(--ink-faint);margin-bottom:18px}
.co-form{display:flex;flex-direction:column;gap:14px}
.field label{
  display:block;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-dim);margin-bottom:7px;
}
html[lang="ar"] .field label{letter-spacing:.07em}
.field input{
  width:100%;background:rgba(255,255,255,.03);border:1px solid var(--hairline);
  border-radius:1px;padding:13px 15px;color:var(--ink);font-size:14px;transition:border-color .35s;
}
.field input:focus{border-color:var(--gold)}
.field input.err{border-color:var(--danger)}
.field .fe{display:none;font-size:11px;color:var(--danger);margin-top:5px}
.field .fe.show{display:block}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.co-title{font-size:21px;margin-bottom:4px}
.co-note{font-size:12px;color:var(--ink-faint);margin-bottom:16px}
.co-actions{display:flex;gap:10px;margin-top:6px}
.ok-panel{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 10px}
.ok-panel .okc{
  width:74px;height:74px;border-radius:50%;border:1px solid var(--ok);display:grid;place-items:center;
  animation:okpop .7s var(--ease);
}
@keyframes okpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.ok-panel .okc svg{width:30px;height:30px;stroke:var(--ok);fill:none;stroke-width:1.6}
.ok-panel h4{font-size:26px}
.ok-panel p{color:var(--ink-dim);font-size:13.5px}
.ok-num{
  font-family:var(--font-head);font-size:19px;color:var(--gold);letter-spacing:.14em;
  border:1px dashed var(--hairline-gold);padding:10px 22px;
}

/* ── Toast ──────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:30px;left:50%;z-index:340;
  transform:translate(-50%,80px);opacity:0;
  transition:transform .55s var(--ease),opacity .45s;
  background:rgba(13,14,15,.94);border:1px solid var(--gold);border-radius:2px;
  padding:14px 26px;font-size:13px;letter-spacing:.05em;display:flex;gap:12px;align-items:center;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  pointer-events:none;white-space:nowrap;max-width:92vw;
}

/* ── Reveal animations ──────────────────────────────────────── */

.wi{display:inline-block;transform:translateY(115%);transition:transform 1.05s var(--ease);transition-delay:var(--d,0s)}
.in .wi,.wi.in{transform:none}
html.no-anim [data-reveal]{opacity:1;transform:none}
html.no-anim .wi{transform:none}

/* ── Reduced motion ─────────────────────────────────────────── */
@media (prefers-reduced-motion:reduce){

}
